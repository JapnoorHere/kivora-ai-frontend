<section
  appScrollProgress
  class="carousel-tint relative overflow-hidden py-20 sm:py-28 text-white"
  [style.backgroundColor]="slide().tint"
  [style.--spin]="spin()"
  [class.carousel-swapping]="isSwapping()"
>
  <div class="absolute inset-0 bg-dot-grid opacity-[0.07] pointer-events-none"></div>

  <!-- Dials behind the dish: four rings, each turning at its own rate, the
       whole set counter-turning when the carousel spins. -->
  <svg
    class="carousel-rings w-[130vmin] h-[130vmin]"
    viewBox="0 0 400 400"
    fill="none"
    aria-hidden="true"
  >
    <circle cx="200" cy="200" r="72" stroke="currentColor" stroke-width="0.7" stroke-dasharray="3 9" />
    <circle cx="200" cy="200" r="104" stroke="currentColor" stroke-width="0.7" stroke-dasharray="1 7" />
    <circle cx="200" cy="200" r="142" stroke="currentColor" stroke-width="0.7" stroke-dasharray="6 14" />
    <circle cx="200" cy="200" r="188" stroke="currentColor" stroke-width="0.7" stroke-dasharray="2 12" />
  </svg>

  <div class="relative z-30 max-w-4xl mx-auto px-6 text-center">
    <div class="carousel-lift-slow">
      <span class="text-[10px] font-black uppercase tracking-[0.22em] text-white/50">Every Cuisine, Properly</span>
      <h2 class="text-3xl sm:text-4xl font-black leading-tight mt-3 mb-10">
        Pick a kitchen.<br class="sm:hidden">
        Kivora already knows the rules.
      </h2>
    </div>

    <div class="carousel-stage carousel-lift-fast flex items-center justify-center gap-5 sm:gap-10">
      <button
        type="button"
        (click)="rotate(-1)"
        appMagnetic
        [appMagneticStrength]="0.25"
        class="shrink-0 w-12 h-12 sm:w-14 sm:h-14 rounded-full border-2 border-white/40 bg-white/10 hover:bg-white/20 text-xl font-black flex items-center justify-center transition-colors duration-200 active:scale-90 focus:outline-none focus-visible:ring-4 focus-visible:ring-white/30 cursor-pointer"
        aria-label="Previous cuisine"
      >←</button>

      <!-- The slot is never transformed, so its rect stays honest while the
           card spins inside it — that rect is the 3D view's viewport. -->
      <div
        appWebglView="carousel"
        [appWebglTexture]="slide().image"
        class="relative w-52 h-52 sm:w-72 sm:h-72 shrink-0"
      >
        <div class="carousel-card w-full h-full" [style.--spin]="spin()">
          <img
            [src]="slide().image"
            [alt]="slide().name + ' dish'"
            width="288"
            height="288"
            loading="lazy"
            decoding="async"
            class="webgl-fallback w-full h-full object-cover rounded-full shadow-[0_30px_70px_-20px_rgba(0,0,0,0.6)] ring-4 ring-white/20"
          />
        </div>
      </div>

      <button
        type="button"
        (click)="rotate(1)"
        appMagnetic
        [appMagneticStrength]="0.25"
        class="shrink-0 w-12 h-12 sm:w-14 sm:h-14 rounded-full border-2 border-white/40 bg-white/10 hover:bg-white/20 text-xl font-black flex items-center justify-center transition-colors duration-200 active:scale-90 focus:outline-none focus-visible:ring-4 focus-visible:ring-white/30 cursor-pointer"
        aria-label="Next cuisine"
      >→</button>
    </div>

    <div class="carousel-label carousel-lift-drift mt-9 min-h-24" aria-live="polite">
      <p class="text-2xl sm:text-3xl font-black">{{ slide().name }}</p>
      <p class="text-xs sm:text-sm font-semibold text-white/60 max-w-sm mx-auto mt-2 leading-relaxed">{{ slide().blurb }}</p>
    </div>

    <div class="flex items-center justify-center gap-1.5 mt-6">
      @for (dot of slides; track dot.name) {
        <div
          class="h-1 rounded-full transition-all duration-500"
          [class.w-6]="dot.name === slide().name"
          [class.w-1.5]="dot.name !== slide().name"
          [class.bg-white]="dot.name === slide().name"
          [class.bg-white/25]="dot.name !== slide().name"
        ></div>
      }
    </div>
  </div>
</section>
