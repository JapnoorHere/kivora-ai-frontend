<!-- ── MOBILE: full-width native-style bottom tab bar ────────────────── -->
@if (isMobileView()) {
  <nav class="fixed bottom-0 left-0 right-0 z-40 flex items-center justify-around px-2 py-2 bg-[#fafaf8]/96 backdrop-blur-xl border-t border-amber-200/40 shadow-[0_-4px_20px_rgba(251,191,36,0.1)] select-none">

    <!-- Discover -->
    <a routerLink="/" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive #mHome="routerLinkActive"
      class="flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-2xl focus:outline-none"
      aria-label="Discover">
      <div class="w-8 h-8 rounded-xl flex items-center justify-center transition-all duration-200" [class.bg-amber-400]="mHome.isActive">
        <svg class="w-4.5 h-4.5" [class.text-slate-900]="mHome.isActive" [class.text-slate-400]="!mHome.isActive" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
      </div>
      <span class="text-[9px] font-bold" [class.text-slate-900]="mHome.isActive" [class.text-slate-400]="!mHome.isActive">Discover</span>
    </a>

    <!-- History -->
    <a routerLink="/recent" routerLinkActive #mRecent="routerLinkActive"
      class="flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-2xl focus:outline-none"
      aria-label="History">
      <div class="w-8 h-8 rounded-xl flex items-center justify-center transition-all duration-200" [class.bg-amber-400]="mRecent.isActive">
        <svg class="w-4.5 h-4.5" [class.text-slate-900]="mRecent.isActive" [class.text-slate-400]="!mRecent.isActive" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <span class="text-[9px] font-bold" [class.text-slate-900]="mRecent.isActive" [class.text-slate-400]="!mRecent.isActive">History</span>
    </a>

    <!-- New Recipe -->
    <button type="button" (click)="newRecipe()"
      class="group flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-2xl focus:outline-none cursor-pointer"
      aria-label="New Recipe">
      <div class="w-8 h-8 rounded-xl bg-amber-400 group-hover:bg-amber-300 flex items-center justify-center transition-all duration-200">
        <svg class="w-4 h-4 text-slate-900" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
      </div>
      <span class="text-[9px] font-black text-slate-700">New</span>
    </button>

    <!-- Report -->
    <button type="button" (click)="isFeedbackOpen.set(true)"
      class="flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-2xl focus:outline-none cursor-pointer"
      aria-label="Report a bug">
      <div class="w-8 h-8 rounded-xl flex items-center justify-center">
        <svg class="w-4.5 h-4.5 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      </div>
      <span class="text-[9px] font-bold text-slate-400">Report</span>
    </button>

    <!-- User -->
    <button type="button"
      (click)="isAuthenticated() ? triggerLogoutConfirm() : redirectToLogin()"
      class="flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-2xl focus:outline-none cursor-pointer"
      [attr.aria-label]="isAuthenticated() ? 'Sign Out' : 'Sign In'">
      <div class="w-8 h-8 rounded-full bg-amber-400/20 border border-amber-400/25 flex items-center justify-center text-amber-700 font-black text-xs uppercase">
        {{ isAuthenticated() ? (currentUser()?.name?.charAt(0) || 'C') : 'G' }}
      </div>
      <span class="text-[9px] font-bold text-slate-400">{{ isAuthenticated() ? 'Account' : 'Sign In' }}</span>
    </button>

  </nav>
}

<!-- ── DESKTOP: floating pill, centered → slides to bottom-right on collapse ── -->
@if (!isMobileView()) {
  <nav
    class="fixed bottom-4 z-40 flex items-center select-none transition-all duration-500 ease-in-out"
    [style.right]="isCollapsed() ? '16px' : '50%'"
    [style.transform]="isCollapsed() ? 'translateX(0)' : 'translateX(50%)'"
    [style.gap]="isCollapsed() ? '0px' : '8px'"
    [style.padding]="isCollapsed() ? '0px' : '8px'"
    [style.background-color]="isCollapsed() ? 'transparent' : 'rgba(250,250,248,0.82)'"
    [style.border]="isCollapsed() ? '1px solid transparent' : '1px solid rgba(251,191,36,0.5)'"
    [style.box-shadow]="isCollapsed() ? 'none' : '0 8px 32px rgba(251,191,36,0.22)'"
    [style.backdrop-filter]="isCollapsed() ? 'none' : 'blur(20px)'"
    [style.border-radius]="'24px'"
  >

    <!-- Collapsible items -->
    <div
      class="flex items-center gap-1 overflow-hidden transition-all duration-300 ease-in-out"
      [style.max-width]="isCollapsed() ? '0px' : '820px'"
      [style.opacity]="isCollapsed() ? '0' : '1'"
      [style.pointer-events]="isCollapsed() ? 'none' : 'auto'"
    >

      <a routerLink="/" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive #navHome="routerLinkActive"
        class="flex flex-col items-center gap-0.5 px-2.5 py-1.5 rounded-2xl transition-all duration-200 hover:bg-slate-900/5 focus:outline-none"
        aria-label="Discover Recipes">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center transition-all duration-200" [class.bg-amber-400]="navHome.isActive">
          <svg class="w-5 h-5 transition-colors duration-200" [class.text-slate-900]="navHome.isActive" [class.text-slate-400]="!navHome.isActive" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
        </div>
        <span class="text-[9px] font-bold whitespace-nowrap" [class.text-slate-900]="navHome.isActive" [class.text-slate-400]="!navHome.isActive">Discover</span>
      </a>

      <a routerLink="/recent" routerLinkActive #navRecent="routerLinkActive"
        class="flex flex-col items-center gap-0.5 px-2.5 py-1.5 rounded-2xl transition-all duration-200 hover:bg-slate-900/5 focus:outline-none"
        aria-label="Recent Recipes">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center transition-all duration-200" [class.bg-amber-400]="navRecent.isActive">
          <svg class="w-5 h-5" [class.text-slate-900]="navRecent.isActive" [class.text-slate-400]="!navRecent.isActive" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <span class="text-[9px] font-bold whitespace-nowrap" [class.text-slate-900]="navRecent.isActive" [class.text-slate-400]="!navRecent.isActive">History</span>
      </a>

      @if (currentRecipe()) {
        <a routerLink="/ingredients" routerLinkActive #navIngredients="routerLinkActive"
          class="flex flex-col items-center gap-0.5 px-2.5 py-1.5 rounded-2xl transition-all duration-200 hover:bg-slate-900/5 focus:outline-none"
          aria-label="Ingredient Checklist">
          <div class="w-9 h-9 rounded-xl flex items-center justify-center transition-all duration-200" [class.bg-amber-400]="navIngredients.isActive">
            <svg class="w-5 h-5" [class.text-slate-900]="navIngredients.isActive" [class.text-slate-400]="!navIngredients.isActive" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
            </svg>
          </div>
          <span class="text-[9px] font-bold whitespace-nowrap" [class.text-slate-900]="navIngredients.isActive" [class.text-slate-400]="!navIngredients.isActive">Checklist</span>
        </a>

        <a routerLink="/steps" routerLinkActive #navSteps="routerLinkActive"
          class="flex flex-col items-center gap-0.5 px-2.5 py-1.5 rounded-2xl transition-all duration-200 hover:bg-slate-900/5 focus:outline-none"
          aria-label="Cooking Steps">
          <div class="w-9 h-9 rounded-xl flex items-center justify-center transition-all duration-200" [class.bg-amber-400]="navSteps.isActive">
            <svg class="w-5 h-5" [class.text-slate-900]="navSteps.isActive" [class.text-slate-400]="!navSteps.isActive" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
            </svg>
          </div>
          <span class="text-[9px] font-bold whitespace-nowrap" [class.text-slate-900]="navSteps.isActive" [class.text-slate-400]="!navSteps.isActive">Steps</span>
        </a>
      }

      <div class="w-px h-6 bg-slate-900/10 shrink-0 mx-1"></div>

      <button type="button" (click)="isFeedbackOpen.set(true)"
        class="flex flex-col items-center gap-0.5 px-2.5 py-1.5 rounded-2xl transition-all duration-200 hover:bg-amber-50 focus:outline-none cursor-pointer"
        aria-label="Report a bug">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center transition-all duration-200 hover:bg-amber-400/15">
          <svg class="w-5 h-5 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        </div>
        <span class="text-[9px] font-bold text-slate-400 whitespace-nowrap">Report</span>
      </button>

      <button type="button" (click)="newRecipe()"
        class="group flex flex-col items-center gap-0.5 px-2.5 py-1.5 rounded-2xl transition-all duration-200 hover:bg-amber-50 focus:outline-none cursor-pointer"
        aria-label="New Recipe">
        <div class="w-9 h-9 rounded-xl bg-amber-400 group-hover:bg-amber-300 flex items-center justify-center transition-all duration-200">
          <svg class="w-5 h-5 text-slate-900" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
          </svg>
        </div>
        <span class="text-[9px] font-black text-slate-700 whitespace-nowrap">New</span>
      </button>

      <button type="button"
        (click)="isAuthenticated() ? triggerLogoutConfirm() : redirectToLogin()"
        class="flex flex-col items-center gap-0.5 px-2.5 py-1.5 rounded-2xl transition-all duration-200 hover:bg-slate-900/5 focus:outline-none cursor-pointer"
        [attr.aria-label]="isAuthenticated() ? 'Sign Out' : 'Sign In'">
        <div class="w-9 h-9 rounded-full bg-amber-400/20 border border-amber-400/25 flex items-center justify-center text-amber-700 font-black text-xs uppercase transition-all hover:ring-2 hover:ring-amber-400/30">
          {{ isAuthenticated() ? (currentUser()?.name?.charAt(0) || 'C') : 'G' }}
        </div>
        <span class="text-[9px] font-bold text-slate-400 whitespace-nowrap">{{ isAuthenticated() ? 'Account' : 'Sign In' }}</span>
      </button>

      <div class="w-1 shrink-0"></div>
    </div>

    <!-- Toggle button — morphs into amber FAB when collapsed -->
    <button type="button" (click)="toggleDock()"
      class="flex items-center justify-center transition-all duration-300 ease-in-out focus:outline-none cursor-pointer shrink-0"
      [style.width]="isCollapsed() ? '44px' : '36px'"
      [style.height]="isCollapsed() ? '44px' : '36px'"
      [style.border-radius]="isCollapsed() ? '50%' : '10px'"
      [style.background-color]="isCollapsed() ? 'rgba(251,191,36,1)' : 'rgba(251,191,36,0.15)'"
      [style.box-shadow]="isCollapsed() ? '0 6px 28px rgba(251,191,36,0.55)' : 'none'"
      [style.color]="isCollapsed() ? 'rgb(15,23,42)' : 'rgb(180,83,9)'"
      [attr.aria-label]="isCollapsed() ? 'Expand dock' : 'Collapse dock'"
    >
      <svg class="w-4 h-4 transition-transform duration-300" [class.rotate-180]="isCollapsed()" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
      </svg>
    </button>

  </nav>
}

@if (isLogoutConfirmOpen()) {
  <app-confirm-dialog
    title="Sign Out Confirmation"
    message="Are you sure you want to end your active culinary session? You can return at any time."
    confirmText="Sign Out"
    cancelText="Stay"
    type="danger"
    (confirm)="confirmLogout()"
    (cancel)="cancelLogout()"
  />
}

@if (isFeedbackOpen()) {
  <app-bug-report-modal (close)="isFeedbackOpen.set(false)" />
}
