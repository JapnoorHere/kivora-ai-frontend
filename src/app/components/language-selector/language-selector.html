<div class="relative inline-block text-left">
  
  <!-- Trigger Button -->
  <button 
    type="button" 
    (click)="toggleDropdown()"
    class="flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-slate-900/5 border border-slate-700/20 hover:bg-slate-900/10 text-xs font-semibold text-slate-800 transition-all duration-300 cursor-pointer focus:outline-none focus:ring-2 focus:ring-amber-500/40"
    [attr.aria-expanded]="isOpen()"
    aria-haspopup="true"
    aria-label="Select Language"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 11.37 7.361 16.5 3 18.5" />
    </svg>
    <span>
      @switch (currentLanguage()) {
        @case ('en') { English }
        @case ('hi') { हिन्दी }
        @case ('pa') { ਪੰਜਾਬੀ }
      }
    </span>
    <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 text-slate-500 transition-transform duration-300" [class.rotate-180]="isOpen()" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  <!-- Menu panel overlay -->
  @if (isOpen()) {
    <div 
      class="absolute right-0 mt-2 w-32 origin-top-right rounded-xl bg-[#fbfbfa]/95 backdrop-blur-xl border border-slate-700/10 shadow-2xl py-1 z-50 animate-fade-in focus:outline-none" 
      role="menu"
    >
      @for (lang of languages; track lang.code) {
        <button
          type="button"
          (click)="selectLanguage(lang.code)"
          class="w-full text-left px-4 py-2 text-xs font-semibold hover:bg-slate-900/5 transition-colors duration-200 cursor-pointer block"
          [class.text-amber-600]="currentLanguage() === lang.code"
          [class.text-slate-700]="currentLanguage() !== lang.code"
          role="menuitem"
        >
          {{ lang.label }}
        </button>
      }
    </div>
  }
</div>
