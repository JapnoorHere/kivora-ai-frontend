<div
  class="fixed bottom-20 right-4 z-200 flex flex-col gap-3 items-end pointer-events-none w-80 max-w-[calc(100vw-28px)]"
  aria-live="polite"
  aria-atomic="false"
  role="region"
  aria-label="Notifications"
>
  @for (toast of toasts(); track toast.id) {
    <div
      class="pointer-events-auto w-full flex items-center gap-3 pl-3 pr-3.5 py-3 rounded-full"
      style="box-shadow: 0 12px 30px rgba(0,0,0,0.35), 0 2px 8px rgba(0,0,0,0.2);"
      [class.toast-enter]="!isExiting(toast.id)"
      [class.toast-exit]="isExiting(toast.id)"
      [style.background-color]="bgColor(toast.type)"
      [attr.role]="toast.type === 'error' ? 'alert' : 'status'"
    >

      <!-- Icon badge -->
      <div class="shrink-0 w-10 h-10 rounded-full bg-white flex items-center justify-center">
        @if (toast.type === 'success') {
          <!-- Checkmark circle filled -->
          <svg class="w-5.5 h-5.5" [style.color]="iconColor(toast.type)" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12zm13.36-1.814a.75.75 0 10-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 00-1.06 1.06l2.25 2.25a.75.75 0 001.14-.094l3.75-5.25z" clip-rule="evenodd" />
          </svg>
        }
        @if (toast.type === 'error') {
          <!-- X circle filled -->
          <svg class="w-5.5 h-5.5" [style.color]="iconColor(toast.type)" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25zm-1.72 6.97a.75.75 0 10-1.06 1.06L10.94 12l-1.72 1.72a.75.75 0 101.06 1.06L12 13.06l1.72 1.72a.75.75 0 101.06-1.06L13.06 12l1.72-1.72a.75.75 0 10-1.06-1.06L12 10.94l-1.72-1.72z" clip-rule="evenodd" />
          </svg>
        }
        @if (toast.type === 'warning') {
          <!-- Exclamation triangle filled -->
          <svg class="w-5.5 h-5.5" [style.color]="iconColor(toast.type)" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M9.401 3.003c1.155-2 4.043-2 5.197 0l7.355 12.748c1.154 2-.29 4.5-2.599 4.5H4.645c-2.309 0-3.752-2.5-2.598-4.5L9.4 3.003zM12 8.25a.75.75 0 01.75.75v3.75a.75.75 0 01-1.5 0V9a.75.75 0 01.75-.75zm0 8.25a.75.75 0 100-1.5.75.75 0 000 1.5z" clip-rule="evenodd" />
          </svg>
        }
        @if (toast.type === 'info') {
          <!-- Info circle filled -->
          <svg class="w-5.5 h-5.5" [style.color]="iconColor(toast.type)" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12zm8.706-1.442c1.146-.573 2.437.463 2.126 1.706l-.709 2.836.042-.02a.75.75 0 01.67 1.34l-.04.022c-1.147.573-2.438-.463-2.127-1.706l.71-2.836-.042.02a.75.75 0 11-.671-1.34l.041-.022zM12 9a.75.75 0 100-1.5.75.75 0 000 1.5z" clip-rule="evenodd" />
          </svg>
        }
      </div>

      <!-- Text -->
      <div class="flex-1 min-w-0">
        @if (toast.title) {
          <p class="text-[13px] font-bold text-white leading-tight">{{ toast.title }}</p>
        }
        <p class="text-[11.5px] font-medium text-white/70 leading-snug mt-0.5">{{ toast.message }}</p>
      </div>

      <!-- Close -->
      <button
        type="button"
        (click)="dismiss(toast.id)"
        class="shrink-0 w-7 h-7 rounded-full border border-white/25 flex items-center justify-center text-white/80 hover:text-white hover:bg-white/10 focus:outline-none cursor-pointer transition-colors duration-150"
        aria-label="Dismiss"
      >
        <svg aria-hidden="true" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

    </div>
  }
</div>
