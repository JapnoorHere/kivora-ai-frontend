<div 
  class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4 select-none animate-fade-in"
  (click)="handleOverlayClick($event)"
  role="alertdialog"
  aria-modal="true"
  [attr.aria-label]="title()"
>
  
  <!-- Dialog box -->
  <div class="relative w-full max-w-xs bg-[#fbfbfa]/95 backdrop-blur-xl border border-white/70 shadow-2xl rounded-3xl p-6 flex flex-col items-center text-center space-y-4 animate-slide-up">
    
    <!-- Top Icon Badge -->
    <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-xl shrink-0 bg-amber-500/10 text-amber-700">
      @switch (type()) {
        @case ('danger') {
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="w-5.5 h-5.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        }
        @case ('warning') {
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="w-5.5 h-5.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        }
        @default {
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="w-5.5 h-5.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        }
      }
    </div>

    <!-- Title & message -->
    <div class="space-y-1.5">
      <h3 class="text-sm font-extrabold text-slate-800 tracking-tight leading-tight">
        {{ title() }}
      </h3>
      <p class="text-[11px] text-slate-500 font-semibold leading-relaxed">
        {{ message() }}
      </p>
    </div>

    <!-- Action Buttons Row -->
    <div class="flex items-center gap-3 w-full pt-2">
      <button 
        type="button" 
        (click)="cancel.emit()"
        class="flex-1 py-2.5 rounded-full border border-slate-300 hover:bg-slate-900/5 text-slate-700 font-bold text-xs transition-all duration-200 cursor-pointer active:scale-98"
      >
        {{ cancelText() }}
      </button>
      <button 
        type="button" 
        (click)="confirm.emit()"
        class="flex-1 py-2.5 rounded-full font-black text-xs tracking-wider uppercase shadow-md transition-all duration-200 cursor-pointer active:scale-98 bg-[#fcd34d] hover:bg-[#fbbf24] text-slate-900"
      >
        {{ confirmText() }}
      </button>
    </div>

  </div>
</div>
