@if (isAuthenticated()) {
  <div class="flex min-h-screen relative">
    
    <!-- Sidebar for Desktop (Collapsible, Full Height, Floating in the Air) -->
    <app-sidebar class="hidden md:block fixed top-0 left-0 bottom-0 z-40 transition-all duration-300" />
    
    <!-- Mobile Sidebar Drawer (Overlay) -->
    @if (isMobileMenuOpen()) {
      <div class="fixed inset-0 z-50 flex md:hidden">
        <!-- Backdrop dim overlay -->
        <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm" (click)="closeMobileMenu()"></div>
        <!-- Drawer content -->
        <app-sidebar [isMobile]="true" class="relative z-10 w-64 h-full flex flex-col justify-between shadow-2xl animate-slide-right" (click)="closeMobileMenu()" />
      </div>
    }
    
    <!-- Main Content Container (Padded on desktop to sit beside the full-height sidebar) -->
    <div class="flex-grow flex flex-col min-h-screen min-w-0 md:pl-20">
      
      <!-- Mobile Top Header Bar -->
      <header class="md:hidden flex items-center justify-between px-6 py-4 bg-[#fbfbfa]/60 backdrop-blur-md border-b border-slate-200/60 sticky top-0 z-40 select-none">
        <button 
          type="button" 
          (click)="toggleMobileMenu()" 
          class="p-1 rounded-lg text-slate-600 hover:bg-slate-900/5 transition-all focus:outline-none" 
          aria-label="Open menu"
        >
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <span class="font-extrabold text-slate-800 tracking-wider text-sm">KIVORA AI</span>
        <div class="w-8 h-8"></div> <!-- Balance spacer -->
      </header>

      <main class="relative flex-grow bg-gradient-to-b from-[#fbfbfa] via-[#f7f5f0] to-[#f4eedb] text-slate-900 flex flex-col justify-between">
        <div class="flex-grow">
          <router-outlet />
        </div>
        <app-footer />
      </main>
    </div>

  </div>
} @else {
  <main class="relative min-h-screen bg-slate-950 text-slate-900">
    <router-outlet />
  </main>
}

<app-loader />
